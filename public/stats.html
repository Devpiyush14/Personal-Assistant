<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice-CV — Stats</title>
<style>
  :root{--bg:#0b1020;--panel:#121a30;--ink:#eaf0ff;--muted:#93a0c2;--accent:#5b8cff;--line:#1f2b4a;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .gate{display:flex;gap:8px;max-width:360px;}
  input[type=password]{flex:1;background:var(--panel);border:1px solid #27345a;border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit;}
  button{background:var(--accent);border:0;border-radius:10px;color:#fff;padding:10px 16px;font:inherit;cursor:pointer;}
  button:active{transform:scale(.97);}
  .err{color:#ff8097;font-size:13px;margin-top:8px;min-height:18px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 24px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
  .card .v{font-size:26px;font-weight:650;margin-top:6px;}
  h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:24px 0 10px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:600;}
  td.n,th.n{text-align:right;white-space:nowrap;}
  .q{word-break:break-word;}
  .bar{height:6px;background:var(--accent);border-radius:3px;display:inline-block;vertical-align:middle;margin-left:8px;}
  .hidden{display:none;}
  .muted{color:var(--muted);}
  .refresh{float:right;background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Voice-CV — Visitor Analytics</h1>
  <p class="sub">Who's visiting your CV assistant and what they ask.</p>

  <div id="gate">
    <div class="gate">
      <input id="pw" type="password" placeholder="Stats password" autocomplete="current-password" />
      <button id="go">View</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="dash" class="hidden">
    <button class="refresh" id="refresh">Refresh</button>
    <div class="cards" id="cards"></div>

    <h2>Top questions</h2>
    <table id="topq"><tbody></tbody></table>

    <h2>Visits by day</h2>
    <table id="byday"><tbody></tbody></table>

    <h2>By country</h2>
    <table id="country"><tbody></tbody></table>

    <h2>Recent questions</h2>
    <table id="recent"><thead><tr><th>When (UTC)</th><th>Country</th><th class="q">Question</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let PW = "";

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function cards(d){
  const items = [
    ["Total visits", d.totalVisits],
    ["Unique visitors", d.uniqueVisitors],
    ["Questions asked", d.totalQuestions],
    ["Sessions that asked", d.askingSessions],
    ["Questions / asking session", d.questionsPerAskingSession],
    ["Engagement rate", d.engagementRate + "%"],
  ];
  $("#cards").innerHTML = items.map(([k,v]) =>
    `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");
}
function rows(sel, data, render){
  const tb = $(sel).querySelector("tbody");
  tb.innerHTML = data.length ? data.map(render).join("") : `<tr><td class="muted">No data yet.</td></tr>`;
}
function maxN(arr){ return arr.reduce((m,x)=>Math.max(m, x.n||0), 0) || 1; }

function render(d){
  cards(d);
  const mq = maxN(d.topQuestions);
  rows("#topq", d.topQuestions, (r) =>
    `<tr><td class="q">${esc(r.q)}</td><td class="n">${r.n}<span class="bar" style="width:${Math.round(60*(r.n/mq))}px"></span></td></tr>`);
  const md = maxN(d.byDay);
  rows("#byday", d.byDay, (r) =>
    `<tr><td>${esc(r.d)}</td><td class="n">${r.n}<span class="bar" style="width:${Math.round(120*(r.n/md))}px"></span></td></tr>`);
  const mc = maxN(d.byCountry);
  rows("#country", d.byCountry, (r) =>
    `<tr><td>${esc(r.country)}</td><td class="n">${r.n}<span class="bar" style="width:${Math.round(120*(r.n/mc))}px"></span></td></tr>`);
  const rt = $("#recent").querySelector("tbody");
  rt.innerHTML = d.recent.length ? d.recent.map(r =>
    `<tr><td class="muted">${esc((r.ts||"").replace("T"," ").replace(/\..*/,""))}</td><td>${esc(r.country)}</td><td class="q">${esc(r.q)}</td></tr>`).join("")
    : `<tr><td class="muted" colspan="3">No questions yet.</td></tr>`;
}

async function load(){
  $("#err").textContent = "";
  try {
    const r = await fetch("/api/stats", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: PW }),
    });
    if (r.status === 401) { $("#err").textContent = "Wrong password."; return false; }
    if (!r.ok) { const e = await r.json().catch(()=>({})); $("#err").textContent = e.error || ("Error " + r.status); return false; }
    const d = await r.json();
    $("#gate").classList.add("hidden");
    $("#dash").classList.remove("hidden");
    render(d);
    return true;
  } catch (e) { $("#err").textContent = "Network error."; return false; }
}

$("#go").addEventListener("click", async () => { PW = $("#pw").value; await load(); });
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
$("#refresh").addEventListener("click", load);
</script>
</body>
</html>
