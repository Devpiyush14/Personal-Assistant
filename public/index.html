<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Piyush Kaushik — Executive Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f3efe7;
    --surface: #fbf9f4;
    --surface-2: #efe9dd;
    --ink: #211f1a;
    --ink-2: #5b564d;
    --ink-3: #928b7e;
    --line: rgba(33, 31, 26, 0.12);
    --line-soft: rgba(33, 31, 26, 0.07);
    --accent: #9a3412;
    --accent-ink: #fdf6ee;
    --accent-soft: rgba(154, 52, 18, 0.10);
    --online: #4d7c0f;
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    width: 100%; max-width: 720px;
    display: flex; flex-direction: column;
    height: 100dvh; padding: 0 20px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    position: relative; overflow: hidden;
    margin-top: 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(33, 31, 26, 0.04);
  }
  .masthead img {
    position: absolute; top: 0; right: 0; height: 100%; width: 62%;
    object-fit: cover; object-position: 60% 55%;
  }
  .masthead .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, var(--surface) 0%, var(--surface) 38%, rgba(251, 249, 244, 0.6) 52%, rgba(251, 249, 244, 0) 72%);
  }
  .masthead .inner {
    position: relative; display: flex; align-items: center; gap: 14px;
    padding: 20px;
  }
  .monogram {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 10px;
    background: var(--ink); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--serif); font-weight: 500; font-size: 19px; letter-spacing: 0.5px;
  }
  .masthead h1 {
    font-family: var(--serif); font-weight: 500; font-size: 23px; line-height: 1.1;
    margin: 0; color: var(--ink);
  }
  .masthead .role { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
  .masthead .status {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--online); }
  .masthead .links { display: flex; gap: 14px; margin-top: 11px; }
  .masthead .links a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-2); text-decoration: none;
    transition: color 0.15s;
  }
  .masthead .links a:hover { color: var(--accent); }
  .masthead .links a:focus-visible { outline: none; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .masthead .links svg { width: 15px; height: 15px; }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 24px 2px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg {
    max-width: 85%; padding: 13px 16px; border-radius: 14px;
    line-height: 1.6; font-size: 15.5px; white-space: pre-wrap; word-wrap: break-word;
    animation: rise 0.28s cubic-bezier(0.2, 0.7, 0.3, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end; background: var(--surface-2); color: var(--ink);
    border-bottom-right-radius: 5px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-bottom-left-radius: 5px;
  }
  .msg.bot strong { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .msg.bot p { margin: 0 0 9px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul { margin: 8px 0 2px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .msg.bot ul:last-child { margin-bottom: 0; }
  .msg.bot li { position: relative; padding-left: 17px; line-height: 1.5; }
  .msg.bot li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .msg.bot a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; transition: color 0.15s, text-decoration-color 0.15s; }
  .msg.bot a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .dots { display: inline-flex; gap: 4px; padding: 2px 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); display: inline-block; animation: blink 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ---------- Suggestions ---------- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 2px 12px; }
  .chip {
    font-size: 13px; color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); padding: 8px 12px; border-radius: 10px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .chip:hover { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- Composer ---------- */
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 10px 10px 14px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea {
    flex: 1; resize: none; min-height: 28px; max-height: 120px;
    background: transparent; color: var(--ink);
    border: 0; padding: 6px 0; font: inherit; font-size: 15.5px; line-height: 1.5;
    outline: none;
  }
  textarea::placeholder { color: var(--ink-3); }
  button.icon {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-2); cursor: pointer; flex: 0 0 auto;
    display: grid; place-items: center;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.06s;
  }
  button.icon svg { width: 18px; height: 18px; stroke-width: 1.5; }
  button.icon:hover { border-color: var(--accent); color: var(--ink); }
  button.icon:active { transform: scale(0.94); }
  button.icon:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button.send { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.send:hover { background: #7f2a0e; border-color: #7f2a0e; color: var(--accent-ink); }
  button.mic.listening { border-color: var(--accent); color: var(--accent); }
  button.mic.listening svg { display: none; }
  .wave { display: none; gap: 2.5px; align-items: center; height: 16px; }
  button.mic.listening svg, button.mic.working svg { display: none; }
  button.mic.listening .wave { display: inline-flex; }
  .wave i {
    width: 3px; height: 16px; border-radius: 2px; background: var(--accent);
    transform: scaleY(0.3); transform-origin: center bottom;
    animation: eq 0.9s infinite ease-in-out;
  }
  .wave i:nth-child(2) { animation-delay: 0.15s; }
  .wave i:nth-child(3) { animation-delay: 0.3s; }
  .wave i:nth-child(4) { animation-delay: 0.45s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
  button.mic.working .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  .spin { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .wave i { animation: none; transform: scaleY(0.7); }
    .dots i, .spin { animation-duration: 0.01ms; }
    .msg { animation: none; }
  }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 2px 6px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track { width: 30px; height: 18px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background 0.15s, border-color 0.15s; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); transition: transform 0.18s, background 0.15s; }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(12px); background: var(--accent-ink); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { font-size: 11.5px; color: var(--ink-3); padding: 0 2px 10px; line-height: 1.5; }
  .foot { padding: 0 2px calc(14px + env(safe-area-inset-bottom)); }

  @media (max-width: 560px) {
    .masthead img { width: 100%; opacity: 0.5; object-position: 65% 55%; }
    .masthead .scrim { background: linear-gradient(90deg, var(--surface) 0%, var(--surface) 30%, rgba(251,249,244,0.75) 60%, rgba(251,249,244,0.4) 100%); }
    .masthead h1 { font-size: 20px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <img src="/hero.webp" alt="" aria-hidden="true" />
    <div class="scrim"></div>
    <div class="inner">
      <div class="monogram" aria-hidden="true">PK</div>
      <div>
        <h1>Piyush Kaushik</h1>
        <p class="role">Senior Technical Product Manager — Voice AI &amp; agentic systems</p>
        <p class="status"><span class="dot"></span>Online · answers drawn from his CV</p>
        <div class="links">
          <a href="https://www.linkedin.com/in/piyushkaushik/" target="_blank" rel="noopener noreferrer" aria-label="Piyush on LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .78 0 1.73v20.54C0 23.22.79 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.73V1.73C24 .78 23.2 0 22.22 0z"/></svg>
            LinkedIn
          </a>
          <a href="https://github.com/Devpiyush14" target="_blank" rel="noopener noreferrer" aria-label="Piyush on GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58 0-.28-.01-1.02-.02-2.01-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.21.7.82.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div class="chips" id="chips">
    <span class="chip">What does Piyush do at Tanla?</span>
    <span class="chip">Tell me about Voice Albert</span>
    <span class="chip">His experience with AI and ML</span>
    <span class="chip">Walk me through his career</span>
  </div>

  <div class="foot">
    <div class="composer">
      <textarea id="input" placeholder="Ask about his experience…" rows="1"></textarea>
      <button class="icon mic" id="mic" title="Speak" aria-label="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="spin" aria-hidden="true"></span>
      </button>
      <button class="icon send" id="send" title="Send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
    <div class="bar">
      <label class="switch"><input type="checkbox" id="speak" checked /><span class="track"></span>Speak answers aloud</label>
    </div>
    <div class="hint" id="voicehint"></div>
  </div>
</div>

<script>
const API = "/api/chat";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const speakEl = document.getElementById("speak");
const voiceHint = document.getElementById("voicehint");

const history = [];           // [{role, content}]
let busy = false;

// Per-visit session id (for questions/session analytics). Per-browser-tab.
const SESSION = (() => {
  try {
    let s = sessionStorage.getItem("cvsid");
    if (!s) { s = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); sessionStorage.setItem("cvsid", s); }
    return s;
  } catch (_) { return "anon-" + Math.random().toString(16).slice(2); }
})();

// Fire-and-forget visit beacon (best effort; never blocks the UI).
try {
  fetch("/api/visit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: SESSION }), keepalive: true }).catch(() => {});
} catch (_) {}

// ---------- UI helpers ----------
function addMsg(text, who, opts = {}) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  if (opts.dots) { el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; }
  else { el.textContent = text; }
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
  return el;
}
// Render the model's light markdown (lead sentence, bullet lists, **bold**) as clean HTML.
function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
// Organization websites — linked automatically wherever a name appears in a reply.
const ORG_LINKS = {
  "Tanla Platforms": "https://www.tanla.com/",
  "Tanla": "https://www.tanla.com/",
  "Zigly": "https://zigly.com/",
  "Petsy": "https://zigly.com/",
  "Affle": "https://affle.com/",
  "Unicommerce": "https://unicommerce.com/",
  "Adobe": "https://www.adobe.com/de",
  "Accenture": "https://www.accenture.com/en",
};
// Longest names first so "Tanla Platforms" matches before "Tanla".
const ORG_RE = /\b(Tanla Platforms|Tanla|Unicommerce|Accenture|Zigly|Petsy|Affle|Adobe)\b/g;
function linkifyOrgs(html) {
  return html.replace(ORG_RE, (m) => {
    const url = ORG_LINKS[m];
    return url ? '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + m + "</a>" : m;
  });
}
function inlineMd(s) {
  const t = escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*/g, "");
  return linkifyOrgs(t);
}
function formatReply(s) {
  const lines = String(s).replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + inlineMd(para.join(" ")) + "</p>"; para = []; } };
  const flushList = () => { if (list) { html += "<ul>" + list + "</ul>"; list = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { flushPara(); list = (list || "") + "<li>" + inlineMd(m[1]) + "</li>"; }
    else if (line === "") { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html || inlineMd(s);
}
// Plain text for speech (strip bullet markers and emphasis).
function toPlain(s) {
  return String(s).replace(/\*+/g, "").replace(/`/g, "").replace(/^\s*[-*•]\s+/gm, "").replace(/\n{2,}/g, ". ");
}
function autogrow() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px"; }
inputEl.addEventListener("input", autogrow);

// ---------- Text-to-speech (free, browser) ----------
function speak(text) {
  if (!speakEl.checked || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.03; u.pitch = 1;
  const vs = window.speechSynthesis.getVoices();
  const pref = vs.find(v => /en-IN/i.test(v.lang)) || vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
  if (pref) u.voice = pref;
  window.speechSynthesis.speak(u);
}
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};

// ---------- Send flow ----------
async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true;
  inputEl.value = ""; autogrow();
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  addMsg(text, "user");
  history.push({ role: "user", content: text });
  const thinking = addMsg("", "bot", { dots: true });

  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, session: SESSION }),
    });
    const data = await r.json();
    const reply = data.reply || "Sorry, I couldn't answer that.";
    thinking.innerHTML = formatReply(reply);
    history.push({ role: "assistant", content: reply });
    speak(toPlain(reply));
  } catch (e) {
    thinking.textContent = "Network error — please try again.";
  } finally {
    busy = false;
  }
}

sendBtn.addEventListener("click", () => send(inputEl.value));
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
});
document.getElementById("chips").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) send(e.target.textContent);
});

// ---------- Voice input (record → Groq Whisper; works on all browsers) ----------
// Web Speech API is unreliable on iOS (every iOS browser is WebKit), so instead we
// record a short clip with MediaRecorder and transcribe it server-side.
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let mediaRecorder = null, chunks = [], recording = false, micStream = null, recMime = "";

function pickMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    for (const c of cands) { if (MediaRecorder.isTypeSupported(c)) return c; }
  }
  return "";
}

async function startRec() {
  if (recording || busy) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    voiceHint.textContent = "Microphone blocked — allow mic access in your browser, or just type.";
    return;
  }
  voiceHint.textContent = "";
  chunks = [];
  recMime = pickMime();
  try { mediaRecorder = recMime ? new MediaRecorder(micStream, { mimeType: recMime }) : new MediaRecorder(micStream); }
  catch (_) { try { mediaRecorder = new MediaRecorder(micStream); } catch (e) { voiceHint.textContent = "Recording isn't supported here — please type."; stopStream(); return; } }

  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  mediaRecorder.onstop = onRecStop;
  mediaRecorder.start();
  recording = true;
  micBtn.classList.add("listening");
  micBtn.setAttribute("aria-label", "Stop recording");
  // Safety cap so a clip never runs away (and stays small/fast to transcribe).
  recTimer = setTimeout(() => { if (recording) stopRec(); }, 30000);
}

function stopStream() { if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; } }
let recTimer = null;
function stopRec() {
  if (recTimer) { clearTimeout(recTimer); recTimer = null; }
  if (mediaRecorder && recording) { try { mediaRecorder.stop(); } catch (_) {} }
}

async function onRecStop() {
  recording = false;
  micBtn.classList.remove("listening");
  micBtn.setAttribute("aria-label", "Speak");
  stopStream();
  const type = (mediaRecorder && mediaRecorder.mimeType) || recMime || "audio/webm";
  const blob = new Blob(chunks, { type });
  if (!blob.size) return;

  micBtn.classList.add("working");
  voiceHint.textContent = "Transcribing…";
  const ext = type.includes("mp4") || type.includes("aac") ? "mp4" : type.includes("ogg") ? "ogg" : "webm";
  const fd = new FormData();
  fd.append("audio", blob, "clip." + ext);
  try {
    const r = await fetch("/api/transcribe", { method: "POST", body: fd });
    const j = await r.json();
    micBtn.classList.remove("working");
    const text = (j.text || "").trim();
    if (text) { voiceHint.textContent = ""; send(text); }
    else { voiceHint.textContent = "Didn't catch that — try again, or type your question."; }
  } catch (e) {
    micBtn.classList.remove("working");
    voiceHint.textContent = "Voice failed — please type your question.";
  }
}

if (canRecord) {
  micBtn.addEventListener("click", () => {
    if (micBtn.classList.contains("working")) return;
    if (recording) stopRec(); else startRec();
  });
} else {
  micBtn.disabled = true;
  micBtn.style.opacity = .4;
  voiceHint.textContent = "Voice input isn't available in this browser — use the text box.";
}

// ---------- Greeting ----------
addMsg("Hi — I'm Piyush Kaushik's assistant. Ask me anything about his product experience, the AI products he's built, or his career history. What would you like to know?", "bot");
</script>
